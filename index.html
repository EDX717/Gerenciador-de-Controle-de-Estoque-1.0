<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Controle de Estoque</title>
</head>

<body>

    <!-------------------------->


    <div class="Bloco-CadastrodeProduto">
        <h1>CONTROLE DE ESTOQUE</h1>
        <hr>
        <div class="container">
            <p>Produto</p><input id="Produto" type="text" placeholder="Nome do Produto">
            <p>Quantidade</p><input id="Quantidade" type="number" placeholder="Quantidade do Produto">
            <p>Valor Unitário</p><input id="ValorUnitario" type="number" placeholder="Valor Unitário do Produto">
        </div>
        <br>
        <button id="BotaoAdi">Adicionar</button> <button id="BotaoEx">Excluir</button>
    <hr>
    </div>


    <div class="Produtos-cadastrados">

        <!-------------------------->

        <div class="Item">
            <h2></h2>
            <p id="ProdutoCada"></p>
        </div>

        <!-------------------------->

        <div class="Item">
            <h2></h2>
            <p id="QuantidadeCada"></p>
        </div>

        <!-------------------------->

        <div class="Item">
            <h2></h2>
            <p id="ValUni"></p>
        </div>

        <!-------------------------->

    </div>
    <script src="script.js"></script>
</body>

</html>
